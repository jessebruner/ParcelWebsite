name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      # The link checker is the gate that matters. A menu item pointing at a page
      # that does not exist shipped once and must not again.
      - name: Every link resolves
        run: npm run links
      - name: Voice guide
        run: npm run voice
